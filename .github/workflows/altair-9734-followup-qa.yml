name: Altair PR 9734 current-dev QA
on:
  push:
    branches: [qa/9734-current-dev-20261010]
    paths: [.github/workflows/altair-9734-followup-qa.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Altairpaca/oh-my-openagent'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Prepare uncommitted merge candidate
        shell: bash
        run: |
          set -euo pipefail
          base=762839e5551317d04086bb7b4e49b25ad175bd92
          old=a37fc10701d597f7be8b3c69efcac0a06fbd4fd4
          git fetch --depth=500 origin "$base" "$old"
          work="$RUNNER_TEMP/omo-9734-followup"
          git worktree add --detach "$work" "$base"
          cd "$work"
          ev="$(node .agents/skills/senpi-qa/scripts/resolve-evidence-dir.mjs --repo-root "$work" --slug 20261010-9734-current-dev)"
          mkdir -p "$ev"
          printf 'BASE=%s\nOLD=%s\nWORK=%s\nEV=%s\n' "$base" "$old" "$work" "$ev" >> "$GITHUB_ENV"
          printf '%s\n' 'Goal: maintain PR 9734 against current dev, retaining the new side-panel output. Merge without committing; resolve only reviewed inventory conflict. Verify RED/GREEN, current types/build/CLI, isolated real Senpi and complete package gate. Record evidence and exact source hashes; do not publish, deploy, use credentials or push candidate code.' > "$ev/plan.txt"
          git -c user.name='Altair Li' -c user.email='137127498+Altairpaca@users.noreply.github.com' merge --no-commit --no-ff "$old" > "$ev/merge.log" 2>&1 || true
          git diff --name-only --diff-filter=U > "$ev/conflicts.txt"
          checker=packages/omo-senpi/plugin/scripts/check-extension-current.mjs
          while IFS= read -r path; do
            test -z "$path" && continue
            test "$path" = "$checker" || { echo "Unexpected conflict: $path"; exit 1; }
            git show "$old:$checker" > "$checker"
            git add "$checker"
          done < "$ev/conflicts.txt"
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          git diff --cached --binary > "$ev/candidate.patch"
          git diff --cached --stat > "$ev/diff-stat.txt"
          git diff --cached --name-only > "$ev/changed-files.txt"
          test "$(wc -l < "$ev/changed-files.txt")" -eq 5
          mkdir -p "$ev/source"
          while IFS= read -r path; do cp --parents "$path" "$ev/source"; done < "$ev/changed-files.txt"
          sha256sum $(cat "$ev/changed-files.txt") > "$ev/source-sha256.txt"
          git submodule update --init --recursive > "$ev/submodules.log" 2>&1
      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          bun install --frozen-lockfile --ignore-scripts > "$EV/install.log" 2>&1
          printf '%s\n' "$WORK/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Prove baseline regression and patched coverage
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          checker=packages/omo-senpi/plugin/scripts/check-extension-current.mjs
          cp "$checker" "$EV/patched-checker.mjs"
          git show "$BASE:$checker" > "$checker"
          set +e
          bun test packages/omo-senpi/plugin/scripts/check-extension-output-coverage.test.mjs > "$EV/red.log" 2>&1
          status=$?
          set -e
          cp "$EV/patched-checker.mjs" "$checker"
          printf '%s\n' "$status" > "$EV/red.exit"
          test "$status" -ne 0
          grep -q '3 fail' "$EV/red.log"
          grep -q '1 pass' "$EV/red.log"
          bun test packages/omo-senpi/plugin/scripts/check-extension-output-coverage.test.mjs packages/omo-senpi/plugin/scripts/check-tracked-outputs.test.mjs packages/omo-senpi/plugin/scripts/build-extension.test.mjs packages/omo-senpi/plugin/scripts/build-extension-runtimes.test.mjs > "$EV/green.log" 2>&1
          node_modules/.bin/tsgo --noEmit -p packages/omo-senpi/tsconfig.json > "$EV/typecheck.log" 2>&1
      - name: Build and fault-inject the actual check CLI
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          bun run build:senpi-plugin > "$EV/build.log" 2>&1
          node packages/omo-senpi/plugin/scripts/build-extension.mjs --check > "$EV/cli-happy.log" 2>&1
          sidecar=packages/omo-senpi/plugin/extensions/gateway-rules-extension.mjs
          git rm --cached --force -- "$sidecar"
          set +e
          node packages/omo-senpi/plugin/scripts/build-extension.mjs --check > "$EV/cli-untracked.log" 2>&1
          status=$?
          set -e
          git reset HEAD -- "$sidecar"
          test "$status" -eq 1
          grep -q 'untracked-output' "$EV/cli-untracked.log"
          cp packages/omo-senpi/.gitignore "$EV/original.gitignore"
          sed -i '/^!\/plugin\/extensions\/gateway-rules-extension.mjs$/d' packages/omo-senpi/.gitignore
          set +e
          node packages/omo-senpi/plugin/scripts/build-extension.mjs --check > "$EV/cli-ignored.log" 2>&1
          status=$?
          set -e
          cp "$EV/original.gitignore" packages/omo-senpi/.gitignore
          test "$status" -eq 1
          grep -q 'ignored-output' "$EV/cli-ignored.log"
          sha256sum -c "$EV/source-sha256.txt"
      - name: Drive real isolated Senpi
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          node packages/omo-senpi/scripts/qa/drive.mjs --self-test > "$EV/driver-self-test.log" 2>&1
          test -x node_modules/.bin/senpi
          SENPI_BIN="$WORK/node_modules/.bin/senpi" node packages/omo-senpi/scripts/qa/drive.mjs > "$EV/live-driver.json" 2> "$EV/live-driver.stderr"
          node --input-type=module -e 'import fs from "node:fs";const r=JSON.parse(fs.readFileSync(process.env.EV+"/live-driver.json","utf8"));if(r.result!=="PASS"||r.ultraworkInjected!==true||r.realSenpiUntouched!==true)throw Error(JSON.stringify(r));console.log(JSON.stringify({result:r.result,realSenpiUntouched:r.realSenpiUntouched,ultraworkInjected:r.ultraworkInjected}));'
      - name: Run complete current Senpi gate
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          bun run test:senpi > "$EV/package-gate.log" 2>&1
          sha256sum -c "$EV/source-sha256.txt" > "$EV/final-source-check.log"
      - name: Capture evidence manifest
        if: always()
        shell: bash
        run: |
          if test -n "${EV:-}" && test -d "$EV"; then
            cd "$EV"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            printf 'Run: %s\nBase: %s\nPrior PR head: %s\n' "$GITHUB_RUN_ID" "$BASE" "$OLD" > run.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omo-9734-current-dev-evidence
          path: ${{ runner.temp }}/omo-9734-followup/.omo/evidence/omo-senpi-adapter/20261010-9734-current-dev/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
