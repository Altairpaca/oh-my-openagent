name: Altair 9805 materializer QA
on:
  push:
    branches: [qa/9805-submodule-retry-20261010]
    paths: [.github/workflows/altair-9805-qa.yml, qa-inputs/9805-materializer.mjs, qa-inputs/9805-test.mjs]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Altairpaca/oh-my-openagent'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        if: runner.os == 'Linux'
        with:
          bun-version: '1.4.2'
      - name: Verify final candidate in an uncommitted isolated worktree
        shell: bash
        run: |
          set -euo pipefail
          base=762839e5551317d04086bb7b4e49b25ad175bd92
          git fetch --depth=1 origin "$base"
          work="$RUNNER_TEMP/omo-9805-final"
          git worktree add --detach "$work" "$base"
          cd "$work"
          ev="$work/.omo/evidence/20261010-9805-final"
          mkdir -p "$ev"
          printf 'WORK=%s\nEV=%s\n' "$work" "$ev" >> "$GITHUB_ENV"
          printf '%s\n' 'Plan: verify final candidate before production commit. Eleven real CLI contract tests against original and patched sources on three operating systems; canonicalize fixture roots and use file URLs for Windows ESM preload. On Linux rerun full Codex gate, typecheck, actual local-build install, real isolated Codex/Senpi mock-provider drives and exact source hash checks. Preserve all assertions. Earlier full-qa run 38038827470 separately captures real Git recovery/exhaustion fault injections of byte-identical production source.' > "$ev/plan.txt"
          script=packages/omo-codex/plugin/scripts/materialize-shared-upstreams.mjs
          testfile=packages/omo-codex/plugin/test/materialize-shared-upstreams.test.mjs
          cp "$GITHUB_WORKSPACE/qa-inputs/9805-test.mjs" "$testfile"
          set +e
          node --test --test-reporter=tap "$testfile" > "$ev/red.log" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > "$ev/red.exit"
          test "$status" -eq 1
          grep -q '^# pass 2$' "$ev/red.log"
          grep -q '^# fail 9$' "$ev/red.log"
          cp "$GITHUB_WORKSPACE/qa-inputs/9805-materializer.mjs" "$script"
          node --test --test-reporter=tap "$testfile" > "$ev/green.log" 2>&1
          grep -q '^# pass 11$' "$ev/green.log"
          grep -q '^# fail 0$' "$ev/green.log"
          git add -N "$testfile"
          git diff --check
          git diff --binary > "$ev/candidate.patch"
          git diff --stat > "$ev/diff-stat.txt"
          git hash-object "$script" "$testfile" > "$ev/source-blobs.txt"
          node --version > "$ev/node-version.txt"
          mkdir -p "$ev/source"
          node --input-type=module -e 'import fs from "node:fs";import path from "node:path";import crypto from "node:crypto";const out=process.argv[1],files=process.argv.slice(2);let lines=[];for(const p of files){const bytes=fs.readFileSync(p),dest=path.join(out,"source",p);fs.mkdirSync(path.dirname(dest),{recursive:true});fs.writeFileSync(dest,bytes);lines.push(crypto.createHash("sha256").update(bytes).digest("hex")+"  "+p);}fs.writeFileSync(path.join(out,"source-sha256.txt"),lines.join("\n")+"\n");' "$ev" "$script" "$testfile"
          tail -10 "$ev/red.log"
          tail -10 "$ev/green.log"
          cat "$ev/source-blobs.txt"
      - name: Complete Codex gate on final bytes
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          git submodule update --init --recursive > "$EV/submodules.log" 2>&1
          bun install --frozen-lockfile --ignore-scripts > "$EV/install.log" 2>&1
          export PATH="$WORK/node_modules/.bin:$PATH"
          bun run test:codex > "$EV/codex-gate.log" 2>&1
          node_modules/.bin/tsgo --noEmit -p packages/omo-codex/tsconfig.json > "$EV/typecheck.log" 2>&1
          sha256sum -c "$EV/source-sha256.txt" > "$EV/post-gate-source-check.log"
      - name: Actual isolated Codex local-build installation and live hooks
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          npm install --prefix "$RUNNER_TEMP/codex-qa-runtime" --no-audit --no-fund @openai/codex > "$EV/codex-runtime-install.log" 2>&1
          export PATH="$RUNNER_TEMP/codex-qa-runtime/node_modules/.bin:$WORK/node_modules/.bin:$PATH"
          codex --version > "$EV/codex-version.txt"
          bash .agents/skills/codex-qa/scripts/install-verify.sh --self-test > "$EV/codex-install-verify.log" 2>&1
          bash .agents/skills/codex-qa/scripts/app-server-drive.sh --plugin > "$EV/codex-live.log" 2> "$EV/codex-live.stderr"
      - name: Shared Native build and real isolated Senpi
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          export PATH="$WORK/node_modules/.bin:$PATH"
          sev="$(node .agents/skills/senpi-qa/scripts/resolve-evidence-dir.mjs --repo-root "$WORK" --slug 20261010-9805-final)"
          mkdir -p "$sev"
          bun run build:senpi-plugin > "$sev/build.log" 2>&1
          SENPI_BIN="$WORK/node_modules/.bin/senpi" node packages/omo-senpi/scripts/qa/drive.mjs > "$sev/live-driver.json" 2> "$sev/live-driver.stderr"
          node --input-type=module -e 'import fs from "node:fs";const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(r.result!=="PASS"||r.ultraworkInjected!==true||r.realSenpiUntouched!==true)throw Error(JSON.stringify(r));' "$sev/live-driver.json"
          sha256sum -c "$EV/source-sha256.txt" > "$EV/final-source-check.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omo-9805-final-${{ matrix.os }}
          path: ${{ runner.temp }}/omo-9805-final/.omo/evidence/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
