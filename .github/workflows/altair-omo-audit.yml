name: Altair public OmO audit snapshot
on:
  push:
    branches: [qa/9568-extension-output-gate-20261008]
    paths: [.github/workflows/altair-omo-audit.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'Altairpaca/oh-my-openagent'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read public repository issues and pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections, datetime, hashlib, json, os, pathlib, time, urllib.parse, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'omo-public-audit'
          root.mkdir()
          baseline = '2026-09-12T11:22:42Z'
          repo = 'code-yeongyu/oh-my-openagent'
          records = []
          urls = []
          def get(url):
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'Altair-public-OmO-audit'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          for page in range(1, 51):
              query = urllib.parse.urlencode({'state':'all','sort':'created','direction':'desc','since':baseline,'per_page':100,'page':page})
              url = 'https://api.github.com/repos/'+repo+'/issues?'+query
              batch = get(url)
              urls.append(url)
              records.extend(x for x in batch if x['created_at'] > baseline)
              if len(batch) < 100 or any(x['created_at'] <= baseline for x in batch):
                  break
              time.sleep(0.4)
          else:
              raise RuntimeError('Pagination limit reached; refusing an incomplete snapshot')
          assert len(records) == len({x['number'] for x in records})
          for kind in ['issue','pr']:
              subset = [x for x in records if ('pull_request' in x) == (kind == 'pr')]
              (root/(kind+'s.json')).write_text(json.dumps(subset, ensure_ascii=False, indent=2))
          extra = {}
          for endpoint in ['branches/dev','releases/latest','pulls/8098','pulls/7880']:
              extra[endpoint] = get('https://api.github.com/repos/'+repo+'/'+endpoint)
          (root/'context.json').write_text(json.dumps(extra, ensure_ascii=False, indent=2))
          counts = collections.Counter(('pr' if 'pull_request' in x else 'issue')+':'+x['state'] for x in records)
          manifest = {'repository':repo,'after':baseline,'captured_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'complete_created_window':True,'counts':dict(counts),'sources':urls,'files':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir() if p.is_file()}}
          (root/'manifest.json').write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: omo-public-audit-20261008
          path: ${{ runner.temp }}/omo-public-audit/
          retention-days: 7
          if-no-files-found: error
