name: Altair public contribution audit
on:
  push:
    branches: [qa/9805-submodule-retry-20261010]
    paths: [.github/workflows/altair-followup-audit.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'Altairpaca/oh-my-openagent'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Capture public issue and PR records
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/omo-followup-audit"
          OUT="$RUNNER_TEMP/omo-followup-audit" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const repo='code-yeongyu/oh-my-openagent', since='2026-10-08T01:11:47Z';
          const startedAt=new Date().toISOString();
          const get=async endpoint=>{
            const r=await fetch('https://api.github.com/'+endpoint,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});
            if(!r.ok)throw Error('GET '+endpoint+' -> '+r.status);
            return r.json();
          };
          const slim=x=>({number:x.number,title:x.title,url:x.html_url,state:x.state,stateReason:x.state_reason,createdAt:x.created_at,updatedAt:x.updated_at,closedAt:x.closed_at,mergedAt:x.merged_at??x.pull_request?.merged_at??null,kind:x.pull_request||x.head?'pr':'issue',author:x.user?.login,labels:x.labels?.map(l=>l.name),assignees:x.assignees?.map(a=>a.login),comments:x.comments,body:x.body,draft:x.draft,head:x.head?.sha,headRef:x.head?.ref,base:x.base?.sha,mergeable:x.mergeable,mergeableState:x.mergeable_state});
          const updated=[];
          for(let page=1;;page++){
            if(page>15)throw Error('Updated issue pagination incomplete');
            const rows=await get(`repos/${repo}/issues?state=all&since=${encodeURIComponent(since)}&sort=updated&direction=asc&per_page=100&page=${page}`);
            updated.push(...rows.map(slim));
            if(rows.length<100)break;
          }
          const newPrs=[];
          for(let page=1;;page++){
            if(page>10)throw Error('PR pagination incomplete');
            const rows=await get(`repos/${repo}/pulls?state=all&sort=created&direction=desc&per_page=100&page=${page}`);
            newPrs.push(...rows.filter(x=>x.created_at>since).map(slim));
            if(rows.length<100||rows.some(x=>x.created_at<=since))break;
          }
          const newIssues=updated.filter(x=>x.kind==='issue'&&x.createdAt>since),own=[];
          for(const [r,numbers] of [[repo,[9734,8098,7880]],['code-yeongyu/senpi',[1421,1558,1237,1238]]]){
            for(const number of numbers){
              const pr=await get(`repos/${r}/pulls/${number}`);
              const comments=await get(`repos/${r}/issues/${number}/comments?per_page=100`);
              const reviews=await get(`repos/${r}/pulls/${number}/reviews?per_page=100`);
              const runs=await get(`repos/${r}/actions/runs?head_sha=${pr.head.sha}&per_page=100`);
              own.push({repo:r,...slim(pr),comments:comments.map(c=>({author:c.user.login,createdAt:c.created_at,url:c.html_url,body:c.body})),reviews:reviews.map(v=>({author:v.user.login,submittedAt:v.submitted_at,state:v.state,url:v.html_url,body:v.body})),runs:runs.workflow_runs.map(w=>({id:w.id,name:w.name,event:w.event,status:w.status,conclusion:w.conclusion,url:w.html_url,createdAt:w.created_at,updatedAt:w.updated_at}))});
            }
          }
          const release=await get(`repos/${repo}/releases/latest`),dev=await get(`repos/${repo}/git/ref/heads/dev`);
          const summary={repo,since,startedAt,endedAt:new Date().toISOString(),dev:dev.object.sha,latestRelease:{tag:release.tag_name,publishedAt:release.published_at,url:release.html_url},updatedItems:updated.length,newIssues:newIssues.length,openNewIssues:newIssues.filter(x=>x.state==='open').length,newPrs:newPrs.length,openNewPrs:newPrs.filter(x=>x.state==='open').length,mergedNewPrs:newPrs.filter(x=>x.mergedAt).length,closedUnmergedNewPrs:newPrs.filter(x=>x.state==='closed'&&!x.mergedAt).length,own:own.map(x=>({repo:x.repo,number:x.number,state:x.state,draft:x.draft,mergeable:x.mergeable,mergeableState:x.mergeableState,head:x.head,runs:x.runs.map(w=>({name:w.name,conclusion:w.conclusion,status:w.status}))}))};
          for(const [name,v] of [['snapshot.json',{summary,newIssues,newPrs,updated,own}],['summary.json',summary]])fs.writeFileSync(path.join(process.env.OUT,name),JSON.stringify(v,null,2)+'\n');
          fs.writeFileSync(path.join(process.env.OUT,'SHA256SUMS'),crypto.createHash('sha256').update(fs.readFileSync(path.join(process.env.OUT,'snapshot.json'))).digest('hex')+'  snapshot.json\n');
          console.log(JSON.stringify(summary,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: omo-followup-public-audit
          path: ${{ runner.temp }}/omo-followup-audit/
          retention-days: 7
          if-no-files-found: error
